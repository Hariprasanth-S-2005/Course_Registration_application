name: Gitleaks Secret Scan

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    env:
      GITLEAKS_VERSION: "8.21.2"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

          gitleaks version

      - name: Run Gitleaks
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect \
              --source . \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
              --report-format json \
              --report-path gitleaks-report.json
          else
            gitleaks detect \
              --source . \
              --report-format json \
              --report-path gitleaks-report.json
          fi

      - name: Generate Summary
        if: always()
        run: |
          if [ ! -f gitleaks-report.json ]; then
            echo "# Gitleaks Summary" >> $GITHUB_STEP_SUMMARY
            echo "No report generated." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          COUNT=$(jq length gitleaks-report.json)

          if [ "$COUNT" -eq 0 ]; then
            echo "# ✅ Gitleaks Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No secrets detected." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          {
            echo "# 🚨 Gitleaks detected secrets 🚨"
            echo ""
            echo "| Rule ID | Commit | File | Start Line |"
            echo "|---------|--------|------|------------|"
          } >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            .[] |
            "| \(.RuleID // "N/A") | \(.Commit[0:7]) | \(.File // "N/A") | \(.StartLine // "N/A") |"
          ' gitleaks-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

      - name: Fail Workflow If Secrets Found
        if: always()
        run: |
          if [ ! -f gitleaks-report.json ]; then
            echo "No report file found."
            exit 0
          fi

          COUNT=$(jq length gitleaks-report.json)

          if [ "$COUNT" -gt 0 ]; then
            echo "❌ $COUNT secret(s) detected."
            exit 1
          fi

          echo "✅ No secrets detected."
