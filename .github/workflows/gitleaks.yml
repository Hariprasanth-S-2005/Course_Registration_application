name: Gitleaks Secret Scan

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: false

      - name: Generate JSON Report
        if: always()
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Create Step Summary
        if: always()
        run: |
          if [ ! -f gitleaks-report.json ]; then
            echo "# Gitleaks Summary" >> $GITHUB_STEP_SUMMARY
            echo "No report generated." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          COUNT=$(jq length gitleaks-report.json)

          if [ "$COUNT" -eq 0 ]; then
            echo "# ✅ Gitleaks Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No secrets detected." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          {
            echo "# 🚨 Gitleaks Findings"
            echo ""
            echo "| Rule ID | File | Line |"
            echo "|---------|------|------|"
          } >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            .[] |
            "| \(.RuleID // "N/A") | \(.File // "N/A") | \(.StartLine // "N/A") |"
          ' gitleaks-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
