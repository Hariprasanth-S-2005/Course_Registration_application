name: gitleaks
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history to scan prior commits

      - name: Run Gitleaks Action
        uses: gitleaks/gitleaks-action@v2
        # Note: v2 is highly recommended for personal repos to avoid v3 org-licensing prompts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
