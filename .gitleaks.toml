title = "gitleaks config"

[[rules]]
id = "universal-properties-secret-detector"
description = "Detected a sensitive assignment pattern"
regex = '''(?i)(password|passwd|secret|token|credential|jwt|api_key|private_key|datasource|db_url|username|user_id)\s*[:=]\s*([^\s]+)'''
secretGroup = 2
keywords = [
  "password", "passwd", "secret", "token", "credential", 
  "jwt", "api_key", "private_key", "datasource", "db_url", 
  "username", "user_id", "url"
]
