title = "gitleaks config"

[[rules]]
id = "spring-properties-password"
description = "Detected plain-text password assignment in application configuration"
# Matches keywords, spaces, assignment symbols (= or :), and the target secret string
regex = '''(?i)(password|passwd|db_password|datasource\.password)\s*[:=]\s*([^\s]+)'''
secretGroup = 2
keywords = ["password", "passwd", "datasource.password"]
